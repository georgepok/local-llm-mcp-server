# Liquid with lowered tau_min — tests rank-compression hypothesis.
# Identical to tr_liquid_n512.yaml EXCEPT tau bounds.
# tau_min=0.05 (vs 0.5 baseline) allows 10x stronger LTC contraction.

d_model: 256
n_heads: 8
n_layers: 6
d_ff: 1024
vocab_size: 50304
max_seq_len: 2048

model_type: liquid

metric_type: diagonal
metric_activation: softplus
n_scales: 3
t_init: [0.1, 1.0, 10.0]
scale_entropy_alpha: 0.01
curvature_lambda: 0.0
curvature_reward_mu: 0.0
metric_lr_mult: 1.0
correlation_length_init: 5.0

curriculum_steps: 0
dropout: 0.1
transport_rank: 8
use_torch_compile: true
metric_rank: 0
n_ode_steps: 16
liquid_routing: attention

# The change we're testing:
liquid_tau_min: 0.05
liquid_tau_max: 1.0
