# ARC Sandwich — let the model discover what geometry it needs.
# No curvature rewards, no transform weighting, no engineering.
# Pure task loss drives everything. 100K steps to learn.
d_model: 256
n_heads: 8
n_layers: 10
d_ff: 1024
d_ffn_fluid: 512
d_metric: 64
n_scales: 3
max_seq_len: 1024
model_type: fgn
architecture_version: "fluid"
geo_metric_type: learned
sandwich_mode: true
sandwich_bottom_geo_layers: 2
sandwich_middle_attn_layers: 2
sandwich_top_geo_layers: 2
sandwich_middle_iters: 8
n_refine_iters: 1
curvature_lambda: 0.0
curvature_reward_mu: 0.0
structural_energy_lambda: 0.0
kappa_floor: 0.0
dropout: 0.1
use_torch_compile: true
metric_lr_mult: 1.0
diffusion_floor: 0.0
