# ARC FluidNet — grok_pure setup (d=256, no penalties, long training)
# Matches resonant_6l.yaml that produced |k|=1412 spike
# diffusion_floor=0.1 prevents geodesic barriers that isolate test_output
d_model: 256
n_heads: 8
n_layers: 6
d_ff: 512
d_ffn_fluid: 512
d_metric: 64
n_scales: 3
max_seq_len: 1024
model_type: fgn
architecture_version: "fluid"
geo_metric_type: learned
curvature_lambda: 0.0
curvature_reward_mu: 0.0
structural_energy_lambda: 0.0
kappa_floor: 0.0
dropout: 0.1
use_torch_compile: true
metric_lr_mult: 1.0
diffusion_floor: 0.0
