# ARC Sandwich — 30M params
# Bottom FluidLayers (spatial reasoning) → Middle Attention (demo→test routing) → Top FluidLayers (output)
# Key: attention handles asymmetric information flow that symmetric diffusion cannot
d_model: 512
n_heads: 8
n_layers: 10
d_ff: 2048
d_ffn_fluid: 1024
d_metric: 128
n_scales: 3
max_seq_len: 1024
model_type: fgn
architecture_version: "fluid"
geo_metric_type: learned
sandwich_mode: true
sandwich_bottom_geo_layers: 3
sandwich_middle_attn_layers: 4
sandwich_top_geo_layers: 3
curvature_lambda: 0.0
curvature_reward_mu: 0.0
structural_energy_lambda: 0.0
kappa_floor: 0.0
dropout: 0.1
use_torch_compile: true
metric_lr_mult: 1.0
diffusion_floor: 0.0
