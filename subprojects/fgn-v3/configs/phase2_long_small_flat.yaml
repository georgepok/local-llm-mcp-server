# FGN v3 Phase 2 — Long-Sequence State Tracking (Flat, Small, Param-Matched)
# Half-size parameter-matched flat baseline. d_ff widened to compensate FGN metric overhead.
# d=64, 3L, 2H, d_ff=276. torch.compile disabled to reduce peak memory.

d_model: 64
n_heads: 2
n_layers: 3
d_ff: 276
vocab_size: 50304
max_seq_len: 5120

model_type: flat

metric_type: diagonal
metric_activation: softplus
n_scales: 3
t_init: [0.1, 1.0, 10.0]
scale_entropy_alpha: 0.01
curvature_lambda: 0.0
correlation_length_init: 5.0
curvature_reward_mu: 0.0
metric_lr_mult: 1.0

curriculum_steps: 0
dropout: 0.1
transport_rank: 8
use_torch_compile: false
