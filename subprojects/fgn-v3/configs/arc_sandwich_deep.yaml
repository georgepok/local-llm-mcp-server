# ARC Sandwich Deep — same params as 30M, 4x more reasoning depth
# d=256 narrow, 16 middle attention layers for deep rule inference
# Hypothesis: model needs more sequential computation to infer transformation rules
d_model: 256
n_heads: 8
n_layers: 22
d_ff: 2048
d_ffn_fluid: 512
d_metric: 64
n_scales: 3
max_seq_len: 1024
model_type: fgn
architecture_version: "fluid"
geo_metric_type: learned
sandwich_mode: true
sandwich_bottom_geo_layers: 3
sandwich_middle_attn_layers: 16
sandwich_top_geo_layers: 3
curvature_lambda: 0.0
curvature_reward_mu: 0.0
structural_energy_lambda: 0.0
kappa_floor: 0.0
dropout: 0.1
use_torch_compile: true
metric_lr_mult: 1.0
diffusion_floor: 0.0
