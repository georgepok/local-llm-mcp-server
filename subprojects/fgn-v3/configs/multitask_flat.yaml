# Phase 1b: Multi-task flat baseline config
# Standard transformer, no Riemannian geometry

d_model: 256
n_heads: 8
n_layers: 6
d_ff: 1024
vocab_size: 50304
max_seq_len: 512

model_type: flat

metric_type: diagonal
metric_activation: softplus

n_scales: 3
t_init: [0.1, 1.0, 10.0]
scale_entropy_alpha: 0.01

curvature_lambda: 0.0
correlation_length_init: 5.0
curvature_reward_mu: 0.0

metric_lr_mult: 0.1

curriculum_steps: 0

dropout: 0.1

transport_rank: 8

use_fp8_metric: false
use_torch_compile: true
