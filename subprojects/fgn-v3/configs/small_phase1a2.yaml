# Phase 1a.2: Task-driven geometry experiment
# Load from post_curriculum.pt (metric already non-flat, CV~0.33)
# Train WikiText with mu=0 — only task loss maintains geometry
# Question: does curvature survive and strengthen without the reward?

d_model: 256
n_heads: 8
n_layers: 6
d_ff: 1024
vocab_size: 50304
max_seq_len: 2048

metric_type: diagonal
metric_activation: softplus

n_scales: 3
t_init: [0.1, 1.0, 10.0]
scale_entropy_alpha: 0.01

# Curvature: NO reward, smoothness only
# Smoothness eta = lambda * ell^2 = 0.001 * 25 = 0.025 (same as 1a.1)
curvature_lambda: 0.001
correlation_length_init: 5.0
curvature_reward_mu: 0.0  # KEY CHANGE: no curvature reward

# No curriculum — loading from post_curriculum.pt checkpoint
curriculum_steps: 0

dropout: 0.1

transport_rank: 8

use_fp8_metric: false
use_torch_compile: true
