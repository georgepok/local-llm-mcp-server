[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "fgn-v3"
version = "0.1.0"
description = "Fluid Geometry Network v3 — Riemannian Attention for Transformers"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1.0",
    "numpy>=1.24.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
train = [
    "transformers>=4.35.0",
    "datasets>=2.14.0",
    "tensorboard>=2.14.0",
    "safetensors>=0.4.0",
]
viz = [
    "matplotlib>=3.7.0",
]

[tool.setuptools.packages.find]
include = ["fgn*"]
