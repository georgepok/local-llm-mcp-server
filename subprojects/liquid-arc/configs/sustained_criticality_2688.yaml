# Sustained Criticality at d=2688 — verify criticality mechanism at scale
# Resumes from distilled_2688_v2_best.pt (step 1000, eval xform ~51%)
# Adds criticality loss + tau_quality_loss, no tau freeze

d_model: 2688
d_metric: 672
d_metric_bottleneck: 0
metric_rank: 0
d_ffn: 5376
max_seq_len: 512
n_ode_steps: 16
ode_steps_min: 16
ode_steps_max: 16
integration_time: 2.0
tau_min: 0.1
tau_max: 3.0
tau_freeze_steps: 0       # tau active from start
t_diffusion_init: 1.0
alpha_logit_init: 2.2
dropout: 0.1

use_torch_compile: false   # d=2688 exceeds Triton shared memory

# Training
base_lr: 3e-4
warmup_steps: 100
weight_decay: 0.01
batch_size: 4

# ARC data
real_arc_mix_ratio: 0.3

# Existing regularization
curvature_lambda: 0.05
tau_var_lambda: 0.0          # DISABLED — replaced by tau_quality_loss
cv_floor_target: 3.0
cv_ceiling_target: 8.0
cv_floor_lambda: 0.1

# Sustained criticality
criticality_loss_enabled: true
criticality_loss_lambda: 0.01
# D²/4τ scales with d_model: d=768→18, d=2688→~63 (ratio * d/768)
criticality_target_ratio: 63.0
criticality_D_sq_target: 250.0    # ~60 * (2688/768)

# Tau quality
tau_quality_loss_enabled: true
tau_quality_lambda: 0.05
tau_mean_target: 1.0
tau_log_spread_target: 0.6

# Convergence coupling
tau_convergence_coupling_enabled: true
tau_convergence_beta: 1.0
tau_cv_coupling_enabled: false

curvature_diversity_loss_enabled: false
