# LiquidARC Phase Transition Reproduction — 572K, Procedural-Only
#
# Clean reproduction of the CV-driven phase transition.
# Zero external dependencies: no ARC data, no fgn-v3, no geo loss.
# Pure CE training on procedural infinite stream.
#
# Expected timeline:
#   Steps 0-5000: Loss plateau at ~2.3, CV climbing 3.0→6.0+
#   Step ~5350:   Phase transition fires (CV crosses ~6.0)
#   Steps 5500-8000: Loss collapses 2.3→0.45, train xform 6%→90%
#   Steps 8000-15000: Consolidation, eval stabilizes
#
# Hardware: Any CUDA GPU with 4GB+ VRAM (572K params, tiny model)

d_model: 256
d_metric: 64
d_ffn: 512
max_seq_len: 2048
n_ode_steps: 16
ode_steps_min: 12
ode_steps_max: 20
tau_min: 0.5
tau_max: 1.0
t_diffusion_init: 1.0
chunk_size: 256
dropout: 0.1
curvature_lambda: 0.05
tau_var_lambda: 0.001
use_torch_compile: true
ode_chunk_size: 4
invertible_solver: false
n_fp_iters: 5
deq_solver: false
deq_ift_iters: 10
n_colors: 10
n_roles: 8
n_sep_types: 4
max_grid_size: 30
max_grids: 16
use_procedural: true
curriculum_stage1_end: 20000
curriculum_stage2_end: 100000
model_type: liquid
transform_weight: 5.0
copy_weight: 0.05
alpha_logit_init: 2.2

# Zero-scaffold: no geo phase, no tau freeze
tau_freeze_steps: 0
geo_loss_enabled: false

# Metric plasticity — CV floor penalty only
cv_floor_target: 3.0
cv_floor_lambda: 0.1

# NO real ARC mixing — pure procedural
real_arc_mix_ratio: 0.0

# Disable TTT (needs ARC data)
ttt_enabled: false
