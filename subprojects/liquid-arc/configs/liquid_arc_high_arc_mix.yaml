# LiquidARC Zero-Scaffold — High ARC Mix (70% real ARC)
#
# Same as zero_scaffold but with real_arc_mix_ratio raised from 0.3 to 0.7.
# Hypothesis: higher real ARC pressure forces geometry that works for both
# procedural and real ARC distributions, closing the generalization gap.
#
# The reproduction run showed two-mode oscillation post-transition:
#   - Procedural batches: CV~5.1, xform~77%
#   - Real ARC batches: CV drops to ~3.7, xform~15-40%
# The geometry partially collapses on real ARC — geometric incompatibility.
# Higher mixing should force the metric to accommodate both.

d_model: 256
d_metric: 64
d_ffn: 512
max_seq_len: 2048
n_ode_steps: 16
ode_steps_min: 12
ode_steps_max: 20
tau_min: 0.5
tau_max: 1.0
t_diffusion_init: 1.0
chunk_size: 256
dropout: 0.1
curvature_lambda: 0.05
tau_var_lambda: 0.001
use_torch_compile: true
ode_chunk_size: 4
invertible_solver: false
n_fp_iters: 5
deq_solver: false
deq_ift_iters: 10
n_colors: 10
n_roles: 8
n_sep_types: 4
max_grid_size: 30
max_grids: 16
use_procedural: true
curriculum_stage1_end: 20000
curriculum_stage2_end: 100000
model_type: liquid
transform_weight: 5.0
copy_weight: 0.05
alpha_logit_init: 2.2

# Zero-scaffold: no geo phase, no tau freeze
tau_freeze_steps: 0
geo_loss_enabled: false

# Metric plasticity
cv_floor_target: 3.0
cv_floor_lambda: 0.1

# HIGH real ARC mixing — 70% real, 30% procedural
real_arc_mix_ratio: 0.7

# TTT for eval diagnostics
ttt_enabled: true
ttt_steps: 100
ttt_lr: 0.001
ttt_curvature_lambda: 0.01
ttt_early_stop_threshold: 0.01
