# LiquidARC 5M — ASYMMETRIC ATTENTION routing variant.
#
# Replaces the symmetric heat-kernel (learned Riemannian metric) with
# transformer-style Q·K attention, while keeping everything else
# LiquidARC: weight-tied ODE with 16 Euler steps, TauNet with
# structural_tau, FFN, causal mask (for distillation).
#
# Motivation: session analysis showed text semantic relationships are
# non-metric (asymmetric, no triangle inequality, context-dependent).
# Forcing a symmetric heat kernel onto non-metric relations caps the
# student's expressive power. Asymmetric Q·K drops that constraint.
#
# Retained from LiquidARC:
#   - Weight-tied iterated ODE dynamics (parameter efficiency)
#   - TauNet + structural_tau (per-position timescale control)
#   - Context-pooled conditioning
#   - Mask infrastructure (for causal training)
#   - FFN residual, zero-init W_o
#
# Dropped:
#   - Heat kernel (softmax(-D²/4t))
#   - Learned diagonal metric g
#   - Low-rank metric component
#   - SOC (criticality_loss on D²/4τ)
#   - CV hinge (cv_floor_lambda)
#   - Curvature penalty (no g → no κ)
#   - System-2 EMA (targets MetricNet weights)
#
# Added:
#   - W_q, W_k linear projections (d → d each, ~600K each)
#   - Scaled dot-product attention inside the ODE

routing_mode: attention

d_model: 768
d_metric: 192          # retained for TauNet config shape; metric_net unused
d_ffn: 1536
max_seq_len: 512

# Metric params still allocated (linear layers exist) but not exercised.
d_metric_bottleneck: 384
metric_rank: 0          # low-rank metric does nothing in attention mode

n_ode_steps: 16
ode_steps_min: 16
ode_steps_max: 16
tau_min: 0.1
tau_max: 3.0
t_diffusion_init: 1.0
chunk_size: 256
dropout: 0.1

curvature_lambda: 0.0
tau_var_lambda: 0.0
alpha_logit_init: 2.2
tau_freeze_steps: 0

# Geometry losses disabled — no metric to control
criticality_loss_enabled: false
criticality_loss_lambda: 0.0
criticality_target_ratio: 0.0
criticality_D_sq_target: 0.0
cv_floor_lambda: 0.0
cv_floor_target: 0.0
cv_ceiling_target: 0.0
curvature_diversity_loss_enabled: false

# tau_quality still useful — drives structural_tau diversity in both regimes
tau_quality_loss_enabled: true
tau_quality_lambda: 0.05
tau_mean_target: 0.0
tau_log_spread_target: 0.6

structural_tau_enabled: true
structural_tau_min: 0.3
structural_tau_max: 3.0

geo_loss_enabled: false

use_procedural: false
use_cellular_automata: false
use_conditional_transforms: false
real_arc_mix_ratio: 0.0

n_colors: 10
n_roles: 8
n_sep_types: 4
max_grid_size: 30
max_grids: 16

model_type: liquid
use_torch_compile: false
ode_chunk_size: 4
invertible_solver: false
n_fp_iters: 5
deq_solver: false
deq_ift_iters: 10

base_lr: 3e-4
batch_size: 1
grad_accum_steps: 1
warmup_steps: 500
weight_decay: 0.01
transform_weight: 5.0
copy_weight: 0.05
