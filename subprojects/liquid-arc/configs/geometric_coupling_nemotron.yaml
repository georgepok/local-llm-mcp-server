# Geometric Coupling: LiquidARC × Nemotron-3-Nano-30B-A3B
# Coupling layers project between d_arc=768 and d_nemotron=2688

# === LiquidARC config (must match fluid metric checkpoint) ===
d_model: 768
d_metric: 192
d_metric_bottleneck: 256
metric_rank: 8
d_ffn: 768
n_ode_steps: 16
tau_min: 0.1
tau_max: 3.0
t_diffusion_init: 1.0
curvature_lambda: 0.05
tau_var_lambda: 0.001
cv_floor_target: 3.0
cv_ceiling_target: 8.0
cv_floor_lambda: 0.1
use_torch_compile: true

# === Coupling config ===
d_qwen: 2688
n_virtual_tokens: 8
qwen_model_path: /workspace/models/NVIDIA-Nemotron-3-Nano-30B-A3B-FP8
arc_checkpoint: /workspace/liquid-arc/output_fluid/stage_b/step_10000.pt

# === Training ===
coupling_lr: 1e-4
arc_dynamics_lr: 1e-6
weight_decay: 0.01
ntp_weight: 1.0
state_pred_weight: 0.01
max_steps: 5000
eval_interval: 100
log_interval: 10
batch_size: 1
max_seq_len: 512
gradient_checkpointing: true

# === Training data ===
text_dataset: wikitext
text_dataset_config: wikitext-2-raw-v1
n_events_per_sequence: 8
event_seq_len: 128
