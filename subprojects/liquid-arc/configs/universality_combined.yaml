# Universality Probe — Combined multi-domain training
#
# Trains on all 4 non-spatial domains simultaneously from 5M checkpoint.
# Equal weighting across sorting, logic, pattern, graph.
# Tests how mixed non-spatial training shapes the geometric substrate.

# Architecture — same 5M model (d=768)
d_model: 768
d_metric: 192
d_ffn: 1536

# Training — 4 micro-batches × 4 samples = 16 effective batch
# Each micro-batch is a different domain (round-robin: sorting→logic→pattern→graph)
batch_size: 4
grad_accum_steps: 4
lr: 1.7e-4
warmup_steps: 500

# No procedural/CA/conditional — universality domains only
use_procedural: false
curriculum_stage1_end: 0
curriculum_stage2_end: 0
real_arc_mix_ratio: 0.0
ca_ratio: 0.0
conditional_ratio: 0.0
procedural_ratio: 0.0

# Combined non-spatial domain ratios (equal weight)
use_universality_domains: true
sorting_ratio: 0.25
logic_ratio: 0.25
pattern_ratio: 0.25
graph_ratio: 0.25

# Zero-scaffold (same as 5M run)
geo_loss_enabled: false
tau_freeze_steps: 0
cv_floor_target: 3.0
cv_ceiling_target: 8.0
cv_floor_lambda: 0.1
curvature_lambda: 0.05

# ODE / solver
n_ode_steps: 16
ode_steps_min: 16
ode_steps_max: 16
ode_chunk_size: 4
tau_min: 0.5
tau_max: 1.0
t_diffusion_init: 1.0

# Sequence / task
max_seq_len: 2048
n_colors: 10
n_roles: 8
n_sep_types: 4
max_grid_size: 30
max_grids: 16
model_type: liquid

# Loss weights
transform_weight: 5.0
copy_weight: 0.05
alpha_logit_init: 2.2
tau_var_lambda: 0.001
dropout: 0.1
use_torch_compile: true
chunk_size: 256

# Solver flags
invertible_solver: false
n_fp_iters: 5
deq_solver: false
deq_ift_iters: 10

# TTT (for eval)
ttt_enabled: true
ttt_steps: 100
ttt_lr: 0.001
ttt_curvature_lambda: 0.01
ttt_early_stop_threshold: 0.01
