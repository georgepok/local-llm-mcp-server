# LiquidARC System 2 — Multi-Timescale Routing Stabilization
#
# Same as zero_scaffold but with System 2 EMA metric blending enabled.
# Late ODE steps blend current metric with slow EMA of past metric weights,
# providing structural memory that stabilizes batch-to-batch geometry whiplash.
#
# ODE step 0:  α=0.00 — pure fast metric (unchanged)
# ODE step 8:  α=0.20 — 80% fast + 20% slow EMA
# ODE step 15: α=0.375 — 62% fast + 38% slow EMA
#
# Zero new trainable parameters — EMA is a buffer.

d_model: 256
d_metric: 64
d_ffn: 512
max_seq_len: 2048
n_ode_steps: 16
ode_steps_min: 12
ode_steps_max: 20
tau_min: 0.5
tau_max: 1.0
t_diffusion_init: 1.0
chunk_size: 256
dropout: 0.1
curvature_lambda: 0.05
tau_var_lambda: 0.001
use_torch_compile: true
ode_chunk_size: 4
invertible_solver: false
n_fp_iters: 5
deq_solver: false
deq_ift_iters: 10
n_colors: 10
n_roles: 8
n_sep_types: 4
max_grid_size: 30
max_grids: 16
use_procedural: true
curriculum_stage1_end: 20000
curriculum_stage2_end: 100000
model_type: liquid
transform_weight: 5.0
copy_weight: 0.05
alpha_logit_init: 2.2

# Zero-scaffold
tau_freeze_steps: 0
geo_loss_enabled: false

# CV bounds
cv_floor_target: 3.0
cv_floor_lambda: 0.1

# 30% ARC mix (same as transition-producing runs)
real_arc_mix_ratio: 0.30

# System 2: multi-timescale routing
system2_enabled: true
system2_ema_momentum: 0.995
system2_max_alpha: 0.4

# TTT for periodic eval
ttt_enabled: true
ttt_steps: 100
ttt_lr: 0.001
ttt_curvature_lambda: 0.01
ttt_early_stop_threshold: 0.01
