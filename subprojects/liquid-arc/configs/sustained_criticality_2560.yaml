# LiquidARC d=2560 — matches Qwen3-4B hidden_size natively
# Criticality + tau_quality from step 0, no distillation needed

d_model: 2560
d_metric: 640              # 25% of d_model
d_metric_bottleneck: 0
metric_rank: 0
d_ffn: 5120                # 2x d_model
max_seq_len: 512
n_ode_steps: 16
ode_steps_min: 16
ode_steps_max: 16
integration_time: 2.0
tau_min: 0.1
tau_max: 3.0
tau_freeze_steps: 0
t_diffusion_init: 1.0
alpha_logit_init: 2.2
dropout: 0.1

use_torch_compile: false

base_lr: 3e-4
warmup_steps: 100
weight_decay: 0.01
batch_size: 4

real_arc_mix_ratio: 0.3

curvature_lambda: 0.05
tau_var_lambda: 0.0
cv_floor_target: 3.0
cv_ceiling_target: 8.0
cv_floor_lambda: 0.1

# Sustained criticality
criticality_loss_enabled: true
criticality_loss_lambda: 0.005
criticality_target_ratio: 60.0    # 18 * (2560/768) ≈ 60
criticality_D_sq_target: 0.0      # no D² anchor

tau_quality_loss_enabled: true
tau_quality_lambda: 0.1
tau_mean_target: 0.0              # auto: T/n_steps*16 = 2.0
tau_log_spread_target: 0.6

tau_convergence_coupling_enabled: false
tau_cv_coupling_enabled: false
curvature_diversity_loss_enabled: false
