# LiquidARC d=2048 — Native match for Qwen3-30B-A3B (hidden_size=2048)
#
# Fresh training with sustained criticality. No projection needed
# when coupling with Qwen3-30B-A3B — delta extraction feeds d=2048
# directly into the ODE, and bias matrix is dimension-free [N,N].
#
# Scaling from d=768 (5M model, phase transition at step ~5500):
#   d_model:  768 → 2048  (2.67x)
#   d_metric: 192 → 512   (d/4 ratio)
#   d_ffn:   1536 → 4096  (2d ratio)
#   params:  ~5M  → ~35M  (d² scaling)
#   LR:      1.7e-4 → 1.0e-4 (sqrt scaling)
#
# Criticality target scales linearly with d:
#   d=768  → D²/4τ = 18
#   d=2048 → D²/4τ = 48  (18 × 2048/768)
#
# d=2048 exceeds Triton shared memory limit (101KB) → torch.compile OFF
# ODE steps fixed at 16 (no randomization without compile)
#
# Training on DGX Spark (fgn-train container):
#   export PYTHONPATH=/workspace/liquid-arc:/workspace/fgn-v3
#   export TRITON_PTXAS_PATH=/usr/local/cuda/bin/ptxas
#   python scripts/train.py --config configs/liquid_arc_2048.yaml \
#       --data_dir /workspace/arc-agi/data --max_steps 25000

# Architecture
d_model: 2048
d_metric: 512
d_metric_bottleneck: 0
metric_rank: 0
d_ffn: 4096
max_seq_len: 512           # ARC tasks fit in 512; 2048 causes 16x slowdown

# ODE integration
n_ode_steps: 16
ode_steps_min: 16        # fixed — no compile, avoid stalls
ode_steps_max: 16
integration_time: 2.0
tau_min: 0.1
tau_max: 3.0
tau_freeze_steps: 0       # tau active from start (criticality manages it)
t_diffusion_init: 1.0
alpha_logit_init: 2.2

# Solver
use_torch_compile: false  # d=2048 exceeds Triton shared mem (213KB > 101KB limit)
ode_chunk_size: 4
invertible_solver: false
deq_solver: false
chunk_size: 256

# Training
base_lr: 1.0e-4           # sqrt-scaled from 1.7e-4 at d=768
warmup_steps: 1000
weight_decay: 0.01
batch_size: 4              # d² memory scaling: 16 × (768/2048)² ≈ 2.3, round to 4
grad_accum_steps: 2        # effective batch = 8
dropout: 0.1

# Task & curriculum
model_type: liquid
use_procedural: true
n_colors: 10
n_roles: 8
n_sep_types: 4
max_grid_size: 30
max_grids: 16
curriculum_stage1_end: 20000
curriculum_stage2_end: 100000

# ARC data mixing (30% real ARC, proven beneficial)
real_arc_mix_ratio: 0.3

# Loss weights
transform_weight: 5.0
copy_weight: 0.05
curvature_lambda: 0.05

# Sustained criticality — self-organized phase transition
criticality_loss_enabled: true
criticality_loss_lambda: 0.01
criticality_target_ratio: 48.0     # D²/4τ target (18 × 2048/768)
criticality_D_sq_target: 0.0      # no D² anchor — let criticality self-organize

# Tau quality (replaces tau_var_loss)
tau_quality_loss_enabled: true
tau_quality_lambda: 0.05
tau_mean_target: 1.0               # productive ODE integration range
tau_log_spread_target: 0.6         # ~2× per-position differentiation
tau_var_lambda: 0.0                # DISABLED — replaced by tau_quality_loss

# CV homeostasis
cv_floor_target: 3.0
cv_ceiling_target: 8.0
cv_floor_lambda: 0.1

# Convergence coupling (tau responds to local convergence)
tau_convergence_coupling_enabled: true
tau_convergence_beta: 1.0
tau_convergence_floor: 0.5

# Norm homeostasis
norm_ref: 45.0                     # sqrt(2048) ≈ 45
norm_lambda: 0.1

# TTT (for eval)
ttt_enabled: true
ttt_steps: 100
ttt_lr: 0.001
ttt_curvature_lambda: 0.01
ttt_early_stop_threshold: 0.01
