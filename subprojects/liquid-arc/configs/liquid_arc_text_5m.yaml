# LiquidARC — ~5M scale text pretraining, criticality-target sweep base.
#
# d=768 matches the canonical 5M ARC config (output_30m in CLAUDE.md).
# With metric_rank=8 the total is ~7M (rank adds ~1.5M); for this sweep
# we accept the slight over-run versus strict 5M because low-rank was
# validated on text (Stage B: ppl 1025→265 with all 8 dims active).
#
# Data: WikiText-103 (50× the tokens of WikiText-2) for diversity-at-scale.
#
# Sweep: criticality_target_ratio ∈ {4, 8, 12, 18} via --criticality_target
# CLI override. At d=768 the linear-scaling default would be 18 × (768/768) = 18,
# same as ARC. 4 and 8 test whether a more-global-routing equilibrium helps
# text.

d_model: 768
d_metric: 192          # d/4, same ratio as ARC 5M config
d_ffn: 1536            # 2d, same ratio
d_metric_bottleneck: 384  # wider bottleneck for semantic richness
metric_rank: 8         # off-diagonal (Stage B validated)
max_seq_len: 512

n_ode_steps: 16
ode_steps_min: 16
ode_steps_max: 16
tau_min: 0.1
tau_max: 3.0
t_diffusion_init: 1.0
chunk_size: 256
dropout: 0.1

curvature_lambda: 0.0
tau_var_lambda: 0.0
alpha_logit_init: 2.2
tau_freeze_steps: 0

# Default criticality target — will be overridden by --criticality_target
# 18 is the canonical ARC target at d=768; the sweep covers 4/8/12/18.
criticality_loss_enabled: true
criticality_loss_lambda: 0.01
criticality_target_ratio: 18.0
criticality_D_sq_target: 0.0

tau_quality_loss_enabled: true
tau_quality_lambda: 0.05
tau_mean_target: 0.0
tau_log_spread_target: 0.6

structural_tau_enabled: true
structural_tau_min: 0.3
structural_tau_max: 3.0

geo_loss_enabled: false
cv_floor_target: 3.0
cv_ceiling_target: 8.0
cv_floor_lambda: 0.1

use_procedural: false
use_cellular_automata: false
use_conditional_transforms: false
real_arc_mix_ratio: 0.0

# Required dataclass fields (ignored in text path)
n_colors: 10
n_roles: 8
n_sep_types: 4
max_grid_size: 30
max_grids: 16

model_type: liquid
use_torch_compile: false   # d>=768 historically unstable under compile in text path
ode_chunk_size: 4
invertible_solver: false
n_fp_iters: 5
deq_solver: false
deq_ift_iters: 10

base_lr: 3e-4
batch_size: 1
grad_accum_steps: 1
warmup_steps: 500
weight_decay: 0.01
transform_weight: 5.0
copy_weight: 0.05
