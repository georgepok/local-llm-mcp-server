# Latent Oracle + Oracle HyperNet — Task-Specific W_o Deltas
#
# 5M LiquidARC (d=768) student, distilled from Qwen3.5-9B oracle embeddings.
# HyperNet predicts task-specific low-rank W_o weight deltas from oracle context.
# 3-phase training: warmup (proj) → distill (proj+ODE+hypernet) → finetune
#
# Base model: output_30m/checkpoints/best.pt (step 21K, 54.2% xform)

# Architecture — same as liquid_arc_5m.yaml
d_model: 768
d_metric: 192
d_ffn: 1536
max_seq_len: 2048
model_type: liquid

# Oracle
oracle_dim: 4096
oracle_embeddings_path: ""   # set via --embeddings CLI arg

# Projection head
proj_d_hidden: 1024
proj_lr: 3e-4

# Kappa distillation schedule
lambda_kappa: 0.1
lambda_kappa_decay: 0.01     # Phase 2: λ_κ × 0.01
warmup_steps: 2000           # Phase 0: projection only
distill_end_step: 20000      # Phase 1 → 2 transition

# Representation similarity distillation — DISABLED (replaced by hypernet)
similarity_path: ""
lambda_distill: 0.0
distill_ramp_start: 0
distill_ramp_end: 5000

# Oracle HyperNet — task-specific W_o deltas
oracle_hypernet_enabled: true
hypernet_task_dim: 256       # adapter bottleneck dimension
hypernet_rank: 8             # rank of low-rank W_o delta
hypernet_scale_init: 0.01   # initial scale for delta magnitude (~226K new params)

# ODE training
ode_lr: 1e-4

# Training
batch_size: 16
max_steps: 50000
log_every: 50
eval_every: 2500
save_every: 5000
grad_clip: 1.0
weight_decay: 0.01

# ODE / solver (from 5M config)
n_ode_steps: 16
ode_steps_min: 16
ode_steps_max: 16
ode_chunk_size: 4
tau_min: 0.5
tau_max: 1.0
t_diffusion_init: 1.0

# Regularization (from 5M config)
curvature_lambda: 0.05
transform_weight: 5.0
copy_weight: 0.05
tau_var_lambda: 0.001
alpha_logit_init: 2.2
tau_freeze_steps: 0          # already pretrained, no freeze needed
dropout: 0.1

# Metric plasticity
cv_floor_target: 3.0
cv_ceiling_target: 8.0
cv_floor_lambda: 0.1

# Solver flags
use_torch_compile: true
invertible_solver: false
deq_solver: false
deq_ift_iters: 10

# ARC task
n_colors: 10
n_roles: 8
n_sep_types: 4
max_grid_size: 30
max_grids: 16

# Procedural not used — 100% real ARC via oracle dataset
use_procedural: false
real_arc_mix_ratio: 0.0

# Features not used
geo_loss_enabled: false
step_embed_enabled: false
channel_gate_enabled: false
ttt_enabled: false
reptile_enabled: false
hypernet_enabled: false
