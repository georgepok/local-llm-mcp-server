# LiquidARC Wake-Sleep V2 — VQ-VAE + AR Decoder + Hybrid Sleep
# Separate subproject: subprojects/wake-sleep/

# Base LiquidARC (same as proven 572K config)
d_model: 256
d_metric: 64
d_ffn: 512
max_seq_len: 2048

# Wake-Sleep V2
ws_enabled: true
ws_z_dim: 128
ws_d_enc: 32

# VQ-VAE
ws_vq_n_embeddings: 64        # codebook size K (shrunk from 512; sequence prevents collapse)
ws_vq_n_tokens: 8             # spatial tokens per task (L = 2×4 pool positions)
ws_vq_beta: 0.25              # commitment loss weight
ws_vq_decay: 0.99             # EMA decay for codebook
ws_vq_dead_restart_every: 50  # re-init dead codes interval (more frequent)
ws_vq_entropy_weight: 0.1     # entropy regularization (reduced; sequence naturally prevents collapse)

# AR Decoder
ws_ar_d_model: 256            # transformer hidden dim
ws_ar_n_heads: 4
ws_ar_n_layers: 4
ws_ar_dropout: 0.1

# Wake-Sleep cycle
ws_wake_only_steps: 5000      # Phase 0: pure wake pre-training
ws_wake_steps: 100            # wake steps per cycle
ws_sleep_steps: 400           # sleep steps per cycle
ws_wake_lr: 3e-4              # encoder + decoder LR
ws_sleep_lr: 1e-4             # ODE + z_proj LR

# Sleep hybridization
ws_real_arc_mix_ratio: 0.5    # 50% real ARC in sleep
ws_unfreeze_wo: true          # melt W_o during sleep + dream-TTT

# Dream generation
ws_concept_bank_size: 10000
ws_z_noise_std: 0.1
ws_interp_alpha_min: 0.2
ws_interp_alpha_max: 0.8
ws_dream_grid_min: 3
ws_dream_grid_max: 10

# Dream-TTT
ws_dream_ttt_steps: 40
ws_dream_ttt_lr: 1e-3

# ODE integration
n_ode_steps: 16
ode_steps_min: 16
ode_steps_max: 16
tau_min: 0.5
tau_max: 1.0
t_diffusion_init: 1.0
tau_freeze_steps: 0
channel_gate_enabled: false

# ARC constants
n_colors: 10
n_roles: 8
n_sep_types: 4
max_grid_size: 30
max_grids: 16
use_procedural: false
model_type: liquid

# Loss weights
transform_weight: 5.0
copy_weight: 0.05
alpha_logit_init: 2.2
tau_var_lambda: 0.001
dropout: 0.1
curvature_lambda: 0.05
cv_floor_target: 3.0
cv_ceiling_target: 8.0
cv_floor_lambda: 0.1

# Solver
use_torch_compile: true
